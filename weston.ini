# Weston 14 configuration. The DRM device and VT are not here: entrypoint.sh passes
# --drm-device and selects the VT from the environment.
[core]
backend=drm
shell=kiosk
renderer=pixman
# Never blank the screen.
idle-time=0
# No input devices are passed into the container, so there is no keyboard or mouse.
require-input=false
# If Weston logs "failed to create kms fb" or "not compatible with dumb buffers", the
# driver rejects the default pixel format. Uncomment to try a 16-bit format:
#gbm-format=rgb565

# To force a video mode, find the connector name in Weston's log ("Output 'VGA-1' ...")
# and add:
# [output]
# name=VGA-1
# mode=1920x1080
